<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Google Analytics (GA4) + Consent Mode v2.
       Счётчик НЕ загружается и НЕ шлёт данные, пока человек не нажмёт «Принять»
       в баннере внизу страницы (см. скрипт перед </body>). -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('consent', 'default', {
      'ad_storage': 'denied',
      'ad_user_data': 'denied',
      'ad_personalization': 'denied',
      'analytics_storage': 'denied',
      'wait_for_update': 500
    });
    window.__gaLoaded = false;
    window.trackEvent = function (name, params) {
      if (!window.__gaLoaded) return;
      gtag('event', name, params || {});
    };
  </script>

  <title>Обо мне — Антон</title>
  <style>
    /* Общие настройки страницы */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f2f4f7;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: #1f2933;
      padding: 24px;
      box-sizing: border-box;
    }

    /* Карточка по центру */
    .card {
      background: #ffffff;
      max-width: 420px;
      width: 100%;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
      box-sizing: border-box;
    }

    /* Круглая заглушка вместо фото.
       Чтобы поставить настоящее фото: положи файл photo.jpg в эту папку
       и замени <div class="photo">А</div> ниже на строку:
       <img class="photo" src="photo.jpg" alt="Фото Антона"> */
    .photo {
      width: 128px;
      height: 128px;
      border-radius: 50%;
      margin: 0 auto 20px;
      background: #d9dee5;
      color: #6b7683;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: 600;
      object-fit: cover; /* пригодится, когда здесь будет <img> */
    }

    h1 {
      margin: 0 0 12px;
      font-size: 26px;
    }

    p {
      margin: 0 0 24px;
      line-height: 1.6;
      color: #52606d;
    }

    /* Кнопка-ссылка на почту */
    .btn {
      display: inline-block;
      padding: 12px 24px;
      border-radius: 10px;
      background: #2563eb;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    .btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <main class="card">
    <!-- Заглушка вместо фотографии. Как заменить на настоящее фото — см. комментарий в <style> -->
    <div class="photo">А</div>

    <h1>Антон</h1>

    <p>
      Я учусь работать с Claude Code.
      Моя цель — научиться делать сайты.
    </p>

    <a class="btn" href="mailto:sapfutr7@gmail.com">Написать мне</a>
  </main>

<script>
  // Клик по контактной ссылке — событие в Google Analytics.
  document.addEventListener("click", function (e) {
    var link = e.target.closest("a[href]");
    if (!link) return;
    var href = link.getAttribute("href");
    if (/^https?:\/\/t\.me\//i.test(href)) {
      trackEvent('contact_telegram_click', { event_category: 'contact', event_label: href });
    } else if (/^https?:\/\/(wa\.me|api\.whatsapp\.com)\//i.test(href)) {
      trackEvent('contact_whatsapp_click', { event_category: 'contact', event_label: href });
    } else if (/^mailto:/i.test(href)) {
      trackEvent('contact_email_click', { event_category: 'contact', event_label: href });
    } else if (/^tel:/i.test(href)) {
      trackEvent('contact_phone_click', { event_category: 'contact', event_label: href });
    }
  });
</script>

<script>
  // Баннер согласия на аналитику (cookie consent) + запуск счётчика после «Принять».
  (function () {
    var GA_ID = "G-JTXYY9B4R5";
    var CONSENT_KEY = "ga_consent";

    function loadGA() {
      if (window.__gaLoaded) return;
      window.__gaLoaded = true;
      gtag('consent', 'update', { analytics_storage: 'granted' });
      var s = document.createElement("script");
      s.async = true;
      s.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
      document.head.appendChild(s);
      gtag('js', new Date());
      gtag('config', GA_ID);
    }

    function showBanner() {
      var banner = document.createElement("div");
      banner.setAttribute("role", "dialog");
      banner.setAttribute("aria-label", "Согласие на использование аналитики");
      banner.style.cssText = "position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#ffffff;border-top:1px solid #e2e8f0;color:#1f2933;padding:20px 24px;display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between;font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;box-shadow:0 -4px 20px rgba(0,0,0,0.08);";
      banner.innerHTML =
        '<div style="max-width:480px;">' +
          '<p style="margin:0 0 6px;font-size:15px;font-weight:600;">Мы используем аналитику</p>' +
          '<p style="margin:0;font-size:13px;line-height:1.5;color:#52606d;">Собираем анонимную статистику посещений (Google Analytics), чтобы понимать, что улучшать на сайте. Без вашего согласия счётчик не запускается.</p>' +
        '</div>' +
        '<div style="display:flex;gap:12px;flex-shrink:0;">' +
          '<button type="button" data-consent="reject" style="padding:10px 20px;border-radius:10px;border:1px solid #d1d5db;background:#ffffff;color:#1f2933;font-size:13px;cursor:pointer;">Отклонить</button>' +
          '<button type="button" data-consent="accept" style="padding:10px 20px;border-radius:10px;border:0;background:#2563eb;color:#ffffff;font-size:13px;font-weight:600;cursor:pointer;">Принять</button>' +
        '</div>';
      document.body.appendChild(banner);

      banner.querySelector('[data-consent="accept"]').addEventListener("click", function () {
        try { localStorage.setItem(CONSENT_KEY, "granted"); } catch (e) {}
        loadGA();
        banner.remove();
      });
      banner.querySelector('[data-consent="reject"]').addEventListener("click", function () {
        try { localStorage.setItem(CONSENT_KEY, "denied"); } catch (e) {}
        gtag('consent', 'update', { analytics_storage: 'denied' });
        banner.remove();
      });
    }

    var saved = null;
    try { saved = localStorage.getItem(CONSENT_KEY); } catch (e) {}
    if (saved === "granted") {
      loadGA();
    } else if (saved !== "denied") {
      showBanner();
    }
  })();
</script>

</body>
</html>
